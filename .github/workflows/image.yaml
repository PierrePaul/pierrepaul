name: Image
on:
  push:
    branches:
      - main
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_REV=${{ github.sha }}
          tags: |
            ghcr.io/pierrepaul/pierrepaul:latest
            ghcr.io/pierrepaul/pierrepaul:${{ github.sha }}
