apiVersion: apps/v1
kind: Deployment
metadata:
  name: pierrepaul
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pierrepaul
  template:
    metadata:
      labels:
        app: pierrepaul
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: web
          image: ghcr.io/pierrepaul/pierrepaul:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pierrepaul
spec:
  selector:
    app: pierrepaul
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pierrepaul
spec:
  rules:
    - host: pierre-paul.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pierrepaul
                port:
                  number: 80
